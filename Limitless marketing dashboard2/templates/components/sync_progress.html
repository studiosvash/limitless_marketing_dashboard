{# Live sync progress bar. In Phase 4 this becomes the partial returned by        #}
{# GET /sync/status/, polled via hx-trigger="every 2s". Params (later, from the   #}
{# sync_log): label, percent, detail, done.                                       #}
<div id="sync-progress"
     class="{% if not active_sync %}hidden{% endif %} rounded-xl border border-brand-200 bg-brand-50 p-4">
  <div class="flex items-center justify-between text-sm mb-2">
    <span class="font-medium text-brand-700">{{ label|default:"Syncing…" }}</span>
    <span class="text-brand-600">{{ percent|default:0 }}%</span>
  </div>
  <div class="h-2 rounded-full bg-brand-100 overflow-hidden">
    <div class="h-full bg-brand-600 transition-all duration-300" style="width:{{ percent|default:0 }}%"></div>
  </div>
  <div class="mt-2 text-xs text-brand-600/70">{{ detail|default:"" }}</div>
</div>
