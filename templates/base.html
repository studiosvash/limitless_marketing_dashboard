{% load static %}
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}FuseHealth{% endblock %}</title>

  <!-- Tailwind (CDN) + brand tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',
              500:'#6366f1',600:'#4f46e5',700:'#4338ca',900:'#312e81'
            }
          }
        }
      }
    }
  </script>

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>

  <!-- Plotly (charts rendered client-side from JSON) -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>

  <!-- Alpine.js (tab switching, interactive UI components) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <link rel="stylesheet" href="{% static 'css/global.css' %}">
  {% block head_extra %}{% endblock %}
</head>
<body class="h-full bg-slate-50 text-slate-900 font-sans antialiased">
  <div class="flex h-full">

    {% include "partials/_sidebar.html" %}

    <div class="flex-1 flex flex-col min-w-0">
      {% include "partials/_topbar.html" %}

      <main class="flex-1 overflow-y-auto p-6 space-y-6">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% block body_extra %}{% endblock %}
</body>
</html>
