{# Stat card. Params: label, value, delta (e.g. "8.2%"), delta_dir ("up"/"down"). #}
<div class="rounded-xl bg-white border border-slate-200 p-5 shadow-sm">
  <p class="text-sm text-slate-500">{{ label }}</p>
  <div class="mt-2 flex items-end justify-between">
    <span class="text-2xl font-semibold tracking-tight">{{ value }}</span>
    {% if delta %}
      {% if delta_dir == "down" %}
        <span class="inline-flex items-center gap-1 text-xs font-medium text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded">▼ {{ delta }}</span>
      {% else %}
        <span class="inline-flex items-center gap-1 text-xs font-medium text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">▲ {{ delta }}</span>
      {% endif %}
    {% endif %}
  </div>
</div>
