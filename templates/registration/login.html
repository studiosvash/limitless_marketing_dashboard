{% extends "registration/auth_base.html" %}

{% block title %}Sign in · FuseHealth{% endblock %}
{% block heading %}Sign in{% endblock %}

{% block content %}
  {% if form.errors %}
    <div class="mt-4 rounded-lg bg-rose-50 border border-rose-100 px-3 py-2 text-sm text-rose-600">
      The username or password is incorrect.
    </div>
  {% endif %}

  <form method="post" action="{% url 'login' %}" class="mt-5 space-y-4">
    {% csrf_token %}
    <div>
      <label for="id_username" class="block text-sm font-medium text-slate-600 mb-1">Email or Username</label>
      <input id="id_username" name="username" type="text" autofocus required
             class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-600">
    </div>
    <div>
      <div class="flex items-center justify-between mb-1">
        <label for="id_password" class="block text-sm font-medium text-slate-600">Password</label>
        <a href="{% url 'password_reset' %}" class="text-xs font-medium text-brand-600 hover:text-brand-700">Forgot password?</a>
      </div>
      <input id="id_password" name="password" type="password" required
             class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-600">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit"
            class="w-full rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2.5 shadow-sm transition">
      Sign in
    </button>
  </form>
{% endblock %}
