{% load static %}
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · FuseHealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
      colors: { brand: {50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',600:'#4f46e5',700:'#4338ca'} }
    } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="h-full bg-slate-50 font-sans antialiased text-slate-900">
  <div class="min-h-full flex items-center justify-center p-6">
    <div class="w-full max-w-sm">

      <div class="flex items-center justify-center gap-2 mb-6">
        <div class="w-9 h-9 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold">F</div>
        <span class="font-semibold text-lg tracking-tight">FuseHealth</span>
      </div>

      <div class="rounded-xl bg-white border border-slate-200 shadow-sm p-6">
        <h1 class="text-[17px] font-semibold tracking-tight">Sign in</h1>
        <p class="text-sm text-slate-400 mt-1">Internal intelligence dashboard</p>

        {% if form.errors %}
          <div class="mt-4 rounded-lg bg-rose-50 border border-rose-100 px-3 py-2 text-sm text-rose-600">
            The username or password is incorrect.
          </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="mt-5 space-y-4">
          {% csrf_token %}
          <div>
            <label for="id_username" class="block text-sm font-medium text-slate-600 mb-1">Username</label>
            <input id="id_username" name="username" type="text" autofocus required
                   class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-600">
          </div>
          <div>
            <label for="id_password" class="block text-sm font-medium text-slate-600 mb-1">Password</label>
            <input id="id_password" name="password" type="password" required
                   class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-600">
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit"
                  class="w-full rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2.5 shadow-sm transition">
            Sign in
          </button>
        </form>
      </div>

      <p class="text-center text-xs text-slate-400 mt-6">FuseHealth · authorized users only</p>
    </div>
  </div>
</body>
</html>
