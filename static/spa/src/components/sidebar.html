<aside style="width: 240px; flex-shrink: 0; background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column;">
    <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid #f1f5f9;">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: #4f46e5; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 28Q28 18 40 26Q48 32 52 20" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18 38Q28 44 38 40" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
      <span style="font-weight: 600; font-size: 15px; letter-spacing: -0.01em;">{{ brandName }}</span>
    </div>

    <nav style="flex: 1; padding: 16px 12px; font-size: 14px; overflow-y: auto;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px 12px;">
        <p style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #cbd5e1; margin: 0;">Dashboard</p>
        <span style="display: flex; gap: 4px;">
          <span onClick="{{ h.histBack }}" title="Back" aria-label="Go back" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: 1px solid #e2e8f0; border-radius: 7px; cursor: {{ backCursor }}; color: {{ backColor }}; background: white;" style-hover="border-color:#cbd5e1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></span>
          <span onClick="{{ h.histFwd }}" title="Forward" aria-label="Go forward" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: 1px solid #e2e8f0; border-radius: 7px; cursor: {{ fwdCursor }}; color: {{ fwdColor }}; background: white;" style-hover="border-color:#cbd5e1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></span>
        </span>
      </div>

      <div style="{{ navStyle.overview }}" style-hover="background:#f8fafc" onClick="{{ h.navOverview }}"><span style="{{ dotStyle.overview }}"></span> Overview</div>

      <div style="{{ navStyle.seo }}" style-hover="background:#f8fafc" onClick="{{ h.navSeo }}">
        <span style="{{ dotStyle.seo }}"></span> SEO
        <svg style="margin-left: auto; color: #94a3b8;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
      </div>

      <sc-if value="{{ seoOpen }}" hint-placeholder-val="{{ true }}">
        <div style="position: relative; padding-left: 20px; margin-bottom: 2px;">
          <span style="position: absolute; left: 8px; top: 2px; bottom: 10px; width: 1px; background: #e2e8f0;"></span>
          <div style="{{ navStyle.domain_overview }}" style-hover="background:#f8fafc" onClick="{{ h.navDomainOverview }}"><span style="{{ dotStyle.domain_overview }}"></span> Domain Overview</div>
          <div style="{{ navStyle.keywords }}" style-hover="background:#f8fafc" onClick="{{ h.navKeywords }}"><span style="{{ dotStyle.keywords }}"></span> Keywords</div>
          <div style="{{ navStyle.positioning }}" style-hover="background:#f8fafc" onClick="{{ h.navPositioning }}"><span style="{{ dotStyle.positioning }}"></span> Position Tracking</div>
          <div style="{{ navStyle.backlinks }}" style-hover="background:#f8fafc" onClick="{{ h.navBacklinks }}"><span style="{{ dotStyle.backlinks }}"></span> Backlinks</div>
          <div style="{{ navStyle.offsite }}" style-hover="background:#f8fafc" onClick="{{ h.navOffsite }}"><span style="{{ dotStyle.offsite }}"></span> Off-site SEO</div>
          <div style="{{ navStyle.pages }}" style-hover="background:#f8fafc" onClick="{{ h.navPages }}"><span style="{{ dotStyle.pages }}"></span> Site Audit</div>
          <div style="{{ navStyle.ai }}" style-hover="background:#f8fafc" onClick="{{ h.navAi }}"><span style="{{ dotStyle.ai }}"></span> AI Optimization</div>
        </div>
      </sc-if>

      <div style="{{ navStyle.ads }}" style-hover="background:#f8fafc" onClick="{{ h.navAds }}">
        <span style="{{ dotStyle.ads }}"></span> Ads
        <svg style="margin-left: auto; color: #94a3b8;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
      </div>
      <sc-if value="{{ adsOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position: relative; padding-left: 20px; margin-bottom: 2px;">
          <span style="position: absolute; left: 8px; top: 2px; bottom: 10px; width: 1px; background: #e2e8f0;"></span>
          <div style="{{ navStyle.campaigns }}" style-hover="background:#f8fafc" onClick="{{ h.navCampaigns }}"><span style="{{ dotStyle.campaigns }}"></span> Campaigns</div>
          <div style="{{ navStyle.terms }}" style-hover="background:#f8fafc" onClick="{{ h.navTerms }}"><span style="{{ dotStyle.terms }}"></span> Search Terms</div>
          <div style="{{ navStyle.attribution }}" style-hover="background:#f8fafc" onClick="{{ h.navAttribution }}"><span style="{{ dotStyle.attribution }}"></span> Attribution</div>
        </div>
      </sc-if>
      <div style="{{ navStyle.alerts }}" style-hover="background:#f8fafc" onClick="{{ h.navAlerts }}">
        <span style="{{ dotStyle.alerts }}"></span> Alerts
        <sc-if value="{{ hasUnacked }}" hint-placeholder-val="{{ false }}">
          <span style="margin-left: auto; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: #fee2e2; color: #b91c1c;">{{ unackedCount }}</span>
        </sc-if>
      </div>
      <sc-if value="{{ canManageSettings }}" hint-placeholder-val="{{ true }}">
        <div style="{{ navStyle.settings }}" style-hover="background:#f8fafc" onClick="{{ h.navSettings }}"><span style="{{ dotStyle.settings }}"></span> Settings</div>
      </sc-if>
    </nav>

    <div style="padding: 12px; border-top: 1px solid #f1f5f9;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 10px; font-size: 11px;">
        <span style="color: #94a3b8; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em;">Data Freshness</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 9999px; font-weight: 500; background: #ecfdf5; color: #059669;">
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #10b981;"></span> {{ freshness }}
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px;">
        <div style="width: 32px; height: 32px; border-radius: 9999px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #64748b;">{{ userInitials }}</div>
        <div style="font-size: 12px; min-width: 0;">
          <div style="font-weight: 500; color: #334155;">{{ userName }}</div>
          <div style="color: #94a3b8;">{{ userRole }}</div>
        </div>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 4px;">
          <span onClick="{{ h.openCpwModal }}" role="button" title="Change Password" aria-label="Change Password" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; color: #64748b; cursor: pointer; transition: all 0.15s ease;" style-hover="background:#f1f5f9;color:#334155">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <span onClick="{{ h.logout }}" role="button" title="Log out of FuseHealth" aria-label="Log out" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; color: #64748b; cursor: pointer; transition: all 0.15s ease;" style-hover="background:#fee2e2;color:#dc2626">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </span>
        </div>
      </div>
    </div>
  </aside>
