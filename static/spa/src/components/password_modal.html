<sc-if value="{{ cpwOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div onClick="{{ h.closeCpwModal }}" style="position: absolute; inset: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(2px);"></div>
    <div style="position: relative; background: white; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); overflow: hidden;">
      <div style="padding: 24px;">
        <h2 style="font-size: 18px; font-weight: 700; color: #0f172a; margin: 0 0 8px;">Change Password</h2>
        <p style="font-size: 13px; color: #64748b; margin: 0 0 20px;">Update your password to keep your account secure.</p>

        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Current Password</label>
          <input type="password" value="{{ cpwOld }}" onInput="{{ h.cpwOldFn }}" style="width: 100%; box-sizing: border-box; font-size: 14px; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none;" style-focus="border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.1)">
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">New Password</label>
          <input type="password" value="{{ cpwNew }}" onInput="{{ h.cpwNewFn }}" style="width: 100%; box-sizing: border-box; font-size: 14px; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none;" style-focus="border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.1)">
          <div style="font-size: 12px; color: #94a3b8; margin-top: 6px;">Must be at least 8 characters long.</div>
        </div>

        <div style="margin-bottom: 24px;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Confirm New Password</label>
          <input type="password" value="{{ cpwNew2 }}" onInput="{{ h.cpwNew2Fn }}" style="width: 100%; box-sizing: border-box; font-size: 14px; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none;" style-focus="border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.1)">
        </div>

        <sc-if value="{{ cpwErr }}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 13px; color: #dc2626; margin-bottom: 16px; padding: 10px 14px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;">{{ cpwMsg }}</div>
        </sc-if>
        
        <sc-if value="{{ cpwMsg }}" hint-placeholder-val="{{ false }}">
          <sc-if value="{{ !cpwErr }}" hint-placeholder-val="{{ true }}">
            <div style="font-size: 13px; color: #059669; margin-bottom: 16px; padding: 10px 14px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px;">{{ cpwMsg }}</div>
          </sc-if>
        </sc-if>

        <div style="display: flex; gap: 12px;">
          <button onClick="{{ h.closeCpwModal }}" style="flex: 1; padding: 10px; font-size: 14px; font-weight: 600; color: #334155; background: white; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer;" style-hover="background:#f8fafc">Cancel</button>
          <button onClick="{{ h.cpwSave }}" style="flex: 1; padding: 10px; font-size: 14px; font-weight: 600; color: white; background: #4f46e5; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;" style-hover="background:#4338ca">
            <sc-if value="{{ cpwBusy }}" hint-placeholder-val="{{ false }}">
              <svg style="animation: fuseSpin 1s linear infinite;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Saving...
            </sc-if>
            <sc-if value="{{ !cpwBusy }}" hint-placeholder-val="{{ true }}">
              Save Password
            </sc-if>
          </button>
        </div>
      </div>
    </div>
  </div>
</sc-if>
