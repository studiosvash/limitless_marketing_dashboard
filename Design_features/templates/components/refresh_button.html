{# Refresh button. Params: label (text), scope ("all" or a page key).            #}
<button type="button"
        hx-post="{% if scope == 'all' %}{% url 'sync:all' %}{% else %}{% url 'sync:page' scope %}{% endif %}"
        hx-target="#sync-progress"
        hx-swap="outerHTML"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        data-scope="{{ scope|default:'all' }}"
        class="inline-flex items-center gap-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 shadow-sm transition">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
  </svg>
  {{ label|default:"Refresh" }}
</button>
